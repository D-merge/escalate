<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1A0B2E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Escalate</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body {
        background: #0F0620;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      @keyframes sunPulse { 0%,100% { box-shadow: 0 0 36px 6px rgba(255,138,61,.5); } 50% { box-shadow: 0 0 56px 12px rgba(255,62,165,.6); } }
      @keyframes gridMove { from { background-position: 0 0, 0 0; } to { background-position: 0 0, 0 16px; } }
      @keyframes glowPulse { 0%,100% { filter: drop-shadow(0 0 3px rgba(255,62,165,.7)); } 50% { filter: drop-shadow(0 0 10px rgba(45,226,230,.9)); } }
      @keyframes eq { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      button { font-family: inherit; cursor: pointer; }
      input, select { font-family: inherit; box-sizing: border-box; }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
